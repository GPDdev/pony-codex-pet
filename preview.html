<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天蓝晨风 · Codex Pet 动画预览</title>
<style>
  body { margin: 0; padding: 32px; background: #eff7fb; color: #23465b; font-family: system-ui, sans-serif; }
  main { max-width: 960px; margin: auto; }
  h1 { font-size: 26px; }
  p { line-height: 1.7; }
  section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 12px; background: white; border-radius: 18px; text-align: center; }
  img { width: 192px; height: 208px; object-fit: contain; image-rendering: pixelated; }
  figcaption { padding: 8px; }
</style>
<main>
  <h1>天蓝晨风 Skyblue</h1>
  <p>由原来的 Pony Town GIF 转换为本机 Codex Pet。空闲时站立约 5.94 秒、眨眼约 0.66 秒。拖拽触发左右飞行动作；鼠标悬停仍是 Codex 内置的跳跃行为。下方为单个状态循环预览，实际状态切换由 Codex 控制。</p>
  <section>
    <figure><img src="previews/idle.gif?v=2" alt="站立快速眨眼"><figcaption>空闲 · 站立快速眨眼</figcaption></figure>
    <figure><img src="previews/running-right.gif?v=2" alt="向右飞"><figcaption>拖拽 · 向右飞行</figcaption></figure>
    <figure><img src="previews/running-left.gif?v=2" alt="向左飞"><figcaption>拖拽 · 向左飞行</figcaption></figure>
    <figure><img src="previews/waving.gif" alt="打招呼"><figcaption>打招呼</figcaption></figure>
    <figure><img src="previews/jumping.gif" alt="跳跃"><figcaption>跳跃</figcaption></figure>
    <figure><img src="previews/failed.gif" alt="打哈欠"><figcaption>失落 · 打哈欠</figcaption></figure>
    <figure><img src="previews/waiting.gif" alt="抬蹄等待"><figcaption>等待 · 抬蹄</figcaption></figure>
    <figure><img src="previews/running.gif" alt="工作时跳舞"><figcaption>工作中 · 跳舞</figcaption></figure>
    <figure><img src="previews/review.gif" alt="坐下起身"><figcaption>审阅 · 坐下起身</figcaption></figure>
  </section>
</main>
</html>
